# CyberSim — complete local environment.
#   cp .env.example .env   (then edit the secrets)
#   docker compose up --build              -> http://localhost:3000
#   docker compose --profile localstack up -> additionally starts LocalStack (optional)
name: cybersim

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersim}
      POSTGRES_USER: ${POSTGRES_USER:-cybersim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cybersim}
      DB_USERNAME: ${POSTGRES_USER:-cybersim}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_DEMO_DATA_ENABLED: ${APP_DEMO_DATA_ENABLED:-true}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@cybersim.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_STUDENT_EMAIL: ${DEMO_STUDENT_EMAIL:-student@cybersim.local}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-low}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_SERVER_SIDE_FALLBACK: ${AI_SERVER_SIDE_FALLBACK:-true}
      APP_SCENARIO_SEED_ENABLED: ${APP_SCENARIO_SEED_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  # Optional AWS emulator — not required by the platform (see docs/en/04-system-architecture.md, ADR-7).
  localstack:
    image: localstack/localstack:4
    profiles: ["localstack"]
    environment:
      SERVICES: s3,iam,sts,logs
    ports:
      - "4566:4566"

volumes:
  pgdata:
