server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers for the SPA
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Same-origin API: the browser never needs CORS in the containerised setup
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # AI feedback generation can take several seconds
    }

    # Client-side routing: unknown paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
